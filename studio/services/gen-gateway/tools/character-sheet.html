<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>캐릭터 시트</title>
<style>
:root{--bg:#101318;--surface:#191e25;--surface2:#202731;--input:#11161d;--line:#333e4b;--text:#f1f4f7;--muted:#a6b2c1;--dim:#8392a3;--accent:#91d8be;--accent-bg:#253e36;--blue:#9bc9f5;--warning:#f3cc8c;--danger:#f7a39b;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;font-size:14px;line-height:1.6}
button,input,textarea,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
input,select,textarea{display:block;width:100%;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
textarea{min-height:70px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #477a69;border-color:var(--accent)}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:var(--surface2);color:var(--text);font-size:13px;font-weight:650}
.btn:hover{background:#2c3540}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{color:#11241c;background:var(--accent);border-color:var(--accent);font-weight:800}.btn.primary:hover{background:#b0e7d2}
.btn.quiet{background:transparent;color:var(--muted)}.btn.small{padding:5px 10px;font-size:12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top select{width:auto;min-width:220px}.top .status{margin-left:auto;font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:9px;padding:9px 10px;font-size:13px}
nav button b{width:22px;height:22px;border-radius:6px;background:#2a343f;color:var(--accent);display:grid;place-items:center;font-size:11px;flex-shrink:0}
nav button.on{background:#2a3f37;border-color:#466554;color:#d8f9eb}nav button.done b{background:var(--accent-bg)}
main{padding:22px 28px 60px;max-width:1180px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.field.full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.nav-foot{display:flex;justify-content:space-between;margin-top:22px}
.memo{margin-top:14px}.memo summary{cursor:pointer;color:var(--muted);font-size:12px}.memo .fields{margin-top:12px}
.review dl{display:grid;grid-template-columns:140px 1fr;gap:4px 14px;margin:8px 0 0;font-size:13px}.review dt{color:var(--muted)}.review dd{margin:0}.review .empty{color:var(--dim)}
pre.prompt{white-space:pre-wrap;background:#10151b;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;line-height:1.7;max-height:320px;overflow:auto;margin:10px 0 0;font-family:inherit}
details.p summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:8px}
.note{font-size:12px;color:var(--muted)}.warn{color:var(--warning)}.bad{color:var(--danger)}
.cands{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cand{position:relative;width:132px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c1015}
.cand img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#0c1015}
.cand.full img{aspect-ratio:2/3}
.cand.wide{width:300px}.cand.wide img,.cand.wide .ph{aspect-ratio:16/9;object-fit:contain}
.cand .ph{display:grid;place-items:center;aspect-ratio:4/5;color:var(--dim);font-size:11px}
.cand .bar{display:flex;gap:4px;padding:5px}.cand .bar .btn{flex:1;padding:4px 6px;font-size:11px}
.cand.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.cand .tag{position:absolute;top:5px;left:5px;background:var(--accent);color:#11241c;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800}
.jobs{font-size:12px;color:var(--muted);margin-top:8px}.jobs span{display:inline-block;margin-right:10px}
.state{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.state:first-of-type{border-top:0}.state .name b{display:block}.state .name small{color:var(--dim);font-size:11px}
.pill{display:inline-block;font-size:10px;border-radius:6px;padding:2px 7px;background:#28343f;color:var(--blue);margin-left:6px}
.pill.once{background:#3b2f22;color:var(--warning)}
.vids{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.vid{border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted)}.vid.ok{color:var(--accent);cursor:pointer}
.locked{opacity:.5;pointer-events:none}
.toast{position:fixed;right:18px;bottom:18px;background:#1f2b27;border:1px solid #466554;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px}
.toast.bad{background:#2d1f1f;border-color:#6b3a36}
</style>
</head>
<body>
<div class="top">
  <select id="charSelect" aria-label="캐릭터 고르기"></select>
  <button type="button" class="btn" id="newChar">새 캐릭터</button>
  <button type="button" class="btn quiet" id="importV2">v2 시트 JSON 불러오기</button>
  <button type="button" class="btn quiet" id="deleteChar">캐릭터 삭제</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <span class="status" id="status" aria-live="polite">불러오는 중…</span>
</div>
<div class="layout">
  <nav id="steps" aria-label="단계"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
'use strict';
(() => {
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

  // 설정 메모 — 이미지 모델은 숫자를 재현하지 못하고, 치수 표현은 안전 검사에 걸릴 수 있어 프롬프트에 넣지 않는다
  memo: [['heightCm','키 (cm)','예: 168'],['weightKg','몸무게 (kg)','예: 61'],['shoulderCm','어깨너비 (cm)',''],['chestCm','가슴둘레 (cm)',''],['underbustCm','밑가슴둘레 (cm)',''],['cupSize','컵 · 사이즈 표기',''],['waistCm','허리둘레 (cm)',''],['hipCm','엉덩이둘레 (cm)',''],['armCm','위팔둘레 (cm)',''],['thighCm','허벅지둘레 (cm)',''],['muscleKg','골격근량 (kg)',''],['bodyFatPct','체지방률 (%)','']],
  costume: [['costume','기본 코스튬 · 색 / 소재 / 핏','예: 짙은 남색 면 작업 재킷, 흰 라운드 티셔츠, 스트레이트 핏 회색 면바지','textarea',true],['accessories','액세서리 · 소지품','예: 검은 스포츠 시계, 작은 은색 귀걸이','textarea',true],['shoes','신발','예: 흰색 가죽 운동화, 낮은 굽'],['heldItem','손에 드는 물건 · 선택','예: 접은 작업용 장갑']]
}
const RATIO = { portrait: { '4:5': [1024, 1280], '3:4': [1024, 1360], '1:1': [1024, 1024] }, full: { '2:3': [1024, 1536], '3:4': [1152, 1536], '9:16': [1152, 2048] } }
// 턴어라운드 시트 — 네 방향을 한 장에 가로로(같이 만들어야 방향끼리 일관된다)
const SHEET = [2048, 1152]
// 기준 자세 — 모든 캐릭터 공통 고정. 턴어라운드의 바탕이고, 실제 포즈는 상태별 전신에서 바뀐다
const BASE_POSE = '앞을 똑바로 보고 선 자세. 몸과 얼굴이 정면, 체중은 양발에 고르게, 발은 어깨너비보다 조금 좁게 벌린다. 팔은 몸 옆에 자연스럽게 내리되 몸통에서 살짝 떨어뜨려 옷과 몸의 실루엣이 보인다.'
const DEFAULT_SETTINGS = { portraitRatio: '4:5', fullRatio: '2:3', background: '밝은 회색 단색 배경', constraints: '', model: 'gpt-image-2.5-sunburst', quality: 'medium', variations: 2, videoSeconds: 4, videoResolution: '480p' }

// ── 공통 상태 규격 — 모든 캐릭터 · 코스튬에 같은 문구 ──────────────

const STATES = [
  { id: 'idle', name: '기본', note: '평상시', loop: true, full: true,
    face: '무표정. 눈과 입 주변의 힘을 풀고 입을 편하게 다문다. 정면 시선.', bust: '어깨 수평, 편안한 중립 자세.', fullPose: '기본 서기 자세.',
    motion: 'Only subtle natural breathing and an occasional slow blink. Head and shoulders stay in place.' },
  { id: 'joy', name: '기쁨', note: '회복 · 음식 · 버프 지속 (엷은 기쁨)', loop: true, full: true, free: true,

  { id: 'suffering', name: '괴로움', note: '독 · 출혈 · 화상 등 지속 피해', loop: true, full: true,

// ── 문서 ────────────────────────────────────────────────────
let doc = null
let step = 0
let saveTimer = null
const thumbs = new Map()
const newDoc = () => ({ schema: 'studio-character', version: 3, name: '', values: {}, settings: { variations: 2, constraints: '' }, costumes: [{ id: 'base', name: '기본 코스튬' }], base: { portrait: { cands: [], chosen: null }, faceSheet: { cands: [], chosen: null }, full: { cands: [], chosen: null }, fullSheet: { cands: [], chosen: null } }, states: { bust: {}, full: {} }, pending: [] })
const v = (id) => String(doc.values[id] ?? '').trim()
// 출력 설정 — 테마 · 비율 · 모델 · 품질 · 영상은 프로젝트 설정(프로젝트마다 하나), 후보 수 · 추가 제약만 캐릭터별
let PROJ = null

const overrides = () => Object.fromEntries(Object.entries(doc.settings.overrides || {}).filter(([k, v]) => OVERRIDABLE.includes(k) && v !== '' && v != null))
const S = () => ({ ...DEFAULT_SETTINGS, ...(PROJ?.settings || {}), ...overrides(), variations: doc.settings.variations ?? 2, constraints: doc.settings.constraints ?? '' })


function toast(text, bad = false) {
  const t = $('toast'); t.textContent = text; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 5000)
}
function setStatus(text) { $('status').textContent = text }
function save() {
  if (!doc?.id) return
  clearTimeout(saveTimer)
  setStatus('저장 중…')

  doc.pending = doc.pending.filter((x) => x.jobId !== j.id)
  if (j.state === 'succeeded') {
    const isVideo = p.key.endsWith('.video')
    const slot = slotOf(isVideo ? p.key.slice(0, -6) : p.key)

      <div class="card">${fields(F.costume)}</div>`
    case 4: {
      const P = { ...DEFAULT_SETTINGS, ...(PROJ?.settings || {}) }
      const o = doc.settings.overrides || {}
      const osel = (key, label, opts) => `<div class="field"><label for="o_${key}">${label}</label><select id="o_${key}" data-o="${key}"><option value="">프로젝트 기본 · ${esc((opts.find(([v]) => String(v) === String(P[key])) || [0, P[key]])[1])}</option>${opts.map(([val, l]) => `<option value="${esc(val)}"${String(o[key] ?? '') === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`
      const rulesList = String(P.rules || '').split('\n').map((l) => l.trim()).filter(Boolean)
      return `<h1>5 · 출력</h1><p class="lead">기본값은 <b>프로젝트 설정</b>(아트 화면 왼쪽 "프로젝트 설정")을 따르고, 이 캐릭터만 다르게 하려면 아래에서 바꿔요.</p>
      <div class="card"><h2>출력 규격</h2><div class="fields" style="margin-top:12px">
        ${osel('model', '이미지 모델', [['gpt-image-2.5-sunburst', 'GPT Image 2.5 Sunburst'], ['gpt-image-2.5-flare', 'GPT Image 2.5 Flare']])}
        ${osel('quality', '이미지 품질', [['low', 'low · 테스트'], ['medium', 'medium'], ['high', 'high'], ['xhigh', 'xhigh']])}
        ${osel('portraitRatio', '상반신 비율', [['4:5', '4:5'], ['3:4', '3:4'], ['1:1', '1:1']])}
        ${osel('fullRatio', '전신 비율', [['2:3', '2:3'], ['3:4', '3:4'], ['9:16', '9:16']])}
        ${osel('videoSeconds', '영상 길이', [[4, '4초'], [5, '5초'], [6, '6초']])}
        ${osel('videoResolution', '영상 해상도', [['480p', '480p'], ['720p', '720p']])}
        <div class="field"><label for="s_variations">기준 이미지 후보 수</label>${sel('variations', [[1, '1장'], [2, '2장'], [3, '3장'], [4, '4장']], S().variations)}</div>
        <div class="field full"><label for="o_background">배경 (비우면 프로젝트 기본 · ${esc(P.background)})</label><input id="o_background" data-o="background" value="${esc(o.background ?? '')}" placeholder="${esc(P.background)}"></div>
      </div></div>
      <div class="card"><h2>공통 제작 규칙 <span class="note">— 프로젝트 설정 → 공통 규칙에서 고쳐요</span></h2><ul class="note" style="margin:10px 0 0;padding-left:18px">${rulesList.map((l) => `<li>${esc(l)}</li>`).join('') || '<li>(없음)</li>'}</ul>
        <div class="field full" style="margin-top:12px"><label for="s_constraints">이 캐릭터만 추가 제약 · 선택</label><textarea id="s_constraints" data-s="constraints" placeholder="예: 눈을 가리는 앞머리 제외, 옷에 로고나 글자 없음">${esc(S().constraints)}</textarea></div></div>`
    }
    case 5: return reviewHtml()
    case 6: return boardHtml()
  }
}
function reviewHtml() {
  const sec = (title, list, st) => `<div class="card"><div class="row"><h2>${title}</h2><span class="spacer"></span><button type="button" class="btn small" data-go="${st}">고치기</button></div><dl>${list.map(([id, label]) => `<dt>${esc(label)}</dt><dd class="${v(id) ? '' : 'empty'}">${esc(v(id) || '비어 있음')}</dd>`).join('')}</dl></div>`
  const missing = ['name', 'gender', 'age', 'faceShape', 'hair', 'costume'].filter((id) => !v(id))
  return `<h1>6 · 검토</h1><p class="lead">빠진 곳을 확인하고 최종 프롬프트를 봐요. 고치려면 각 칸의 "고치기"를 눌러요.</p>
    ${missing.length ? `<p class="warn">비어 있는 중요 항목: ${missing.map((id) => esc([...F.identity, ...F.face, ...F.costume].find((f) => f[0] === id)?.[1])).join(' · ')}</p>` : ''}
    <div class="review">${sec('기본 정보', F.identity, 0)}${sec('얼굴', F.face, 1)}${sec('체형', F.body, 2)}${sec('기본 코스튬', F.costume, 3)}</div>
    <div class="card"><div class="row"><h2>출력 (프로젝트 설정)</h2><span class="spacer"></span><button type="button" class="btn small" data-go="4">보기</button></div><p class="note">${esc(S().model)} · 품질 ${esc(S().quality)} · 상반신 ${esc(S().portraitRatio)} · 전신 ${esc(S().fullRatio)} · 영상 ${esc(S().videoSeconds)}초 ${esc(S().videoResolution)}</p></div>
    <div class="card"><h2>최종 프롬프트 · 기준 초상화</h2><pre class="prompt">${esc(portraitPrompt())}</pre>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button type="button" class="btn primary" data-go="6">제작으로 →</button></div></div>`
}
function candHtml(key, slot, full, wide = false) {
  const pend = doc.pending.filter((p) => p.key === key)
  const items = slot.cands.map((c) => {
    const src = thumbs.get(c.outputId)
    if (src === undefined) loadThumb(c.outputId)
    const chosen = slot.chosen === c.outputId
    return `<div class="cand${full ? ' full' : ''}${wide ? ' wide' : ''}${chosen ? ' chosen' : ''}">${chosen ? '<span class="tag">확정</span>' : ''}${src ? `<img src="${src}" alt="">` : `<div class="ph">${src === '' ? '미리보기 없음' : '미리보기…'}</div>`}<div class="bar"><button type="button" class="btn" data-choose="${key}|${c.outputId}">${chosen ? '확정됨' : '확정'}</button><button type="button" class="btn quiet" data-reveal="${c.outputId}" aria-label="파일 보기">파일</button></div></div>`
  }).join('')
  return `${items ? `<div class="cands">${items}</div>` : ''}${pend.length ? `<div class="jobs">${pend.map((p) => `<span>⏳ ${esc(stateLabel(p.state))}</span>`).join('')}</div>` : ''}`
}
const stateLabel = (s) => ({ awaiting_approval: '승인 대기 — 앱의 카드에서 승인', submitting: '제출 중', running: '생성 중' })[s] || '대기 중'
function boardHtml() {
  const P = doc.base.portrait, FS = doc.base.faceSheet, B = doc.base.full, BS = doc.base.fullSheet
  const baseCard = (which, title, open, why, prompt, wide, tall) => `<div class="card ${open ? '' : 'locked'}"><div class="row"><h2>${title}</h2><span class="note">${esc(why)}</span><span class="spacer"></span><button type="button" class="btn primary" data-gen-base="${which}" ${open ? '' : 'disabled'}>후보 ${esc(S().variations)}장 요청</button></div>
      <details class="p"><summary>프롬프트 보기</summary><pre class="prompt">${esc(prompt)}</pre></details>${candHtml('base.' + which, doc.base[which], tall, wide)}</div>`
  const stRow = (kind, st) => {
    const key = `${kind}.${st.id}`
    const slot = slotOf(key)
    const still = stateStill(kind, st)
    const vids = (slot.videos ?? []).map((x, i) => `<span class="vid ok" data-reveal="${x.outputId}">영상 ${i + 1} · 파일</span>`).join('')
    const vpend = doc.pending.filter((p) => p.key === key + '.video').map((p) => `<span class="vid">⏳ ${esc(stateLabel(p.state))}</span>`).join('')
    return `<div class="state"><div class="name"><b>${esc(st.name)}<span class="pill${st.loop ? '' : ' once'}">${st.loop ? '반복' : '순간'}</span></b><small>${esc(st.note)}</small></div><div>
      ${st.id === 'idle' ? `<p class="note">기준 ${kind === 'full' ? '전신' : '초상화'}를 그대로 써요.</p>` : `<div class="row"><button type="button" class="btn small" data-gen-state="${kind}|${st.id}" ${(kind === 'full' ? BS.chosen : FS.chosen) ? '' : 'disabled'}>이미지 요청</button><span class="note">${slot.chosen ? '확정됨' : slot.cands.length ? '후보에서 확정해 주세요' : ''}</span></div>${candHtml(key, slot, kind === 'full')}`}
      <div class="vids"><button type="button" class="btn small" data-gen-video="${kind}|${st.id}" ${still ? '' : 'disabled'}>영상 요청 (${esc(S().videoSeconds)}초 · ${esc(S().videoResolution)})</button>${vids}${vpend}</div>
      <details class="p"><summary>프롬프트 보기</summary><pre class="prompt">${esc(st.id === 'idle' ? '(기준 이미지 사용)' : statePrompt(kind, st))}\n\n── 영상 ──\n${esc(videoPrompt(st))}</pre></details>
    </div></div>`
  }
  const todo = (kind) => STATES.filter((st) => (kind === 'bust' || st.full) && st.id !== 'idle' && !slotOf(`${kind}.${st.id}`).chosen && !doc.pending.some((p) => p.key === `${kind}.${st.id}`))
  return `<h1>7 · 제작</h1><p class="lead">요청하면 앱에 승인 카드가 떠요. 승인해서 만들어진 후보 중 하나를 "확정"하면 다음 단계가 열려요. 얼굴 → 얼굴 시트 → 전신 → 전신 시트 순서로 인물을 굳힌 뒤, 상태는 기준 이미지와 시트를 함께 참조해 만들어요.</p>
    ${baseCard('portrait', '① 기준 초상화 · 얼굴 클로즈업', true, '', portraitPrompt(), false, false)}
    ${baseCard('faceSheet', '② 얼굴 턴어라운드 · 정면 · 반측면 · 측면 · 후면', !!P.chosen, P.chosen ? '확정한 초상화를 참조해요' : '① 확정 후 열려요', faceSheetPrompt(), true, false)}
    ${baseCard('full', '③ 기준 전신', !!FS.chosen, FS.chosen ? '초상화 · 얼굴 시트를 참조해요' : '② 확정 후 열려요', fullPrompt(), false, true)}
    ${baseCard('fullSheet', '④ 전신 턴어라운드 · 정면 · 반측면 · 측면 · 후면', !!B.chosen, B.chosen ? '기준 전신 · 얼굴 시트를 참조해요' : '③ 확정 후 열려요', fullSheetPrompt(), true, false)}
    <div class="card ${FS.chosen ? '' : 'locked'}"><div class="row"><h2>⑤ 상반신 상태 · 메인 UI</h2><span class="note">${FS.chosen ? '' : '② 확정 후 열려요'}</span><span class="spacer"></span><button type="button" class="btn" data-batch="bust" ${FS.chosen && todo('bust').length ? '' : 'disabled'}>남은 상태 ${todo('bust').length}개 한 번에 요청</button></div>
      ${STATES.map((st) => stRow('bust', st)).join('')}</div>
    <div class="card ${BS.chosen ? '' : 'locked'}"><div class="row"><h2>⑥ 전신 상태 · 상세창</h2><span class="note">${BS.chosen ? '' : '④ 확정 후 열려요'}</span><span class="spacer"></span><button type="button" class="btn" data-batch="full" ${BS.chosen && todo('full').length ? '' : 'disabled'}>남은 상태 ${todo('full').length}개 한 번에 요청</button></div>
      ${STATES.filter((s) => s.full).map((st) => stRow('full', st)).join('')}</div>`
}
function render() {
  if (!doc) { $('main').innerHTML = '<p class="note">캐릭터를 고르거나 새로 만들어 주세요.</p>'; $('steps').innerHTML = ''; return }
  const filled = [F.identity, F.face, F.body, F.costume].map((l) => l.some(([id]) => v(id)))
  $('steps').innerHTML = STEPS.map((name, i) => `<button type="button" data-step="${i}" class="${i === step ? 'on' : ''}${filled[i] ? ' done' : ''}"><b>${i + 1}</b>${esc(name)}</button>`).join('')
  const sy = scrollY
  $('main').innerHTML = stepHtml() + (step < 6 ? `<div class="nav-foot"><button type="button" class="btn quiet" data-step="${step - 1}" ${step === 0 ? 'disabled' : ''}>← 이전</button><button type="button" class="btn primary" data-step="${step + 1}">다음 →</button></div>` : '')
  scrollTo(0, sy)
}
async function loadThumb(id) {
  thumbs.set(id, null)
  try {
    const d = await studio.thumb(id, 360)
    thumbs.set(id, d || '')
    if (!d) toast('미리보기를 만들지 못했어요(이미지가 아니거나 읽을 수 없음)', true)
  } catch (e) { thumbs.set(id, ''); toast('미리보기 실패: ' + e.message, true) }
  render()
}

// ── 이벤트 ──────────────────────────────────────────────────
document.addEventListener('input', (e) => {
  const t = e.target
  if (t.dataset.f) { doc.values[t.dataset.f] = t.value; save(); if (t.dataset.f === 'name') doc.name = t.value }
  if (t.dataset.s && t.tagName !== 'SELECT') { doc.settings[t.dataset.s] = t.value; save() }
  if (t.dataset.o && t.tagName !== 'SELECT') { (doc.settings.overrides ??= {})[t.dataset.o] = t.value; save() }
})
document.addEventListener('change', (e) => {
  const t = e.target
  if (t.dataset.s && t.tagName === 'SELECT') { doc.settings[t.dataset.s] = t.value; save(); render() }
  if (t.dataset.o && t.tagName === 'SELECT') { (doc.settings.overrides ??= {})[t.dataset.o] = t.value; save(); render() }
})
document.addEventListener('click', (e) => {
  const b = e.target.closest('button,[data-reveal]')
  if (!b || b.disabled) return
  const d = b.dataset
  if (d.step != null) { step = Math.max(0, Math.min(6, Number(d.step))); scrollTo(0, 0); render() }
  else if (d.go != null) { step = Number(d.go); scrollTo(0, 0); render() }
  else if (d.genBase) genBase(d.genBase)
  else if (d.genState) { const [k, id] = d.genState.split('|'); genState(k, STATES.find((s) => s.id === id)) }
  else if (d.genVideo) { const [k, id] = d.genVideo.split('|'); genVideo(k, STATES.find((s) => s.id === id)) }
  else if (d.batch) { const kind = d.batch; STATES.filter((st) => (kind === 'bust' || st.full) && st.id !== 'idle' && !slotOf(`${kind}.${st.id}`).chosen && !doc.pending.some((p) => p.key === `${kind}.${st.id}`)).forEach((st) => genState(kind, st)) }
  else if (d.choose) {
    const [key, oid] = d.choose.split('|'); const slot = slotOf(key)
    if (slot.chosen && slot.chosen !== oid && key.startsWith('base.') && !confirm('기준 이미지를 바꾸면 이미 만든 상태 이미지와 맞지 않을 수 있어요. 바꿀까요?')) return
    slot.chosen = oid; save(); render()
  } else if (d.reveal) studio.reveal(d.reveal).catch(() => toast('이 PC에 보관된 파일이 없어요.', true))
})
$('charSelect').addEventListener('change', (e) => open(e.target.value))
$('newChar').addEventListener('click', async () => {
  doc = newDoc(); doc.id = 'c' + Date.now().toString(36); doc.name = '새 캐릭터'
  step = 0; await studio.characters.save(doc.id, doc); await refreshList(); $('charSelect').value = doc.id; render(); setStatus('새 캐릭터를 만들었어요')
})
$('deleteChar').addEventListener('click', async () => {
  if (!doc || !confirm(`'${doc.name}' 캐릭터 파일을 지울까요? 만든 이미지는 아트 라이브러리에 남아요.`)) return
  await studio.characters.remove(doc.id); doc = null; await refreshList(); const first = $('charSelect').value; first ? open(first) : render()
})
// 이전 v2 시트(JSON) 불러오기 — 같은 항목 이름을 그대로 옮긴다
$('importV2').addEventListener('click', () => $('importFile').click())
$('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''
  if (!f) return
  try {
    const j = JSON.parse(await f.text())
    const vals = j?.values
    if (!vals || typeof vals !== 'object') throw new Error('v2 캐릭터 시트 JSON이 아니에요')
    doc = newDoc(); doc.id = 'c' + Date.now().toString(36)
    const known = new Set([...F.identity, ...F.face, ...F.body, ...F.memo, ...F.costume].map((x) => x[0]))
    for (const [k, val] of Object.entries(vals)) if (known.has(k) && (typeof val === 'string' || typeof val === 'number')) doc.values[k] = String(val)
    // 비율 · 배경은 프로젝트 설정을 따른다 — 캐릭터별 추가 제약만 옮긴다
    if (typeof vals.constraints === 'string') doc.settings.constraints = vals.constraints
    doc.name = v('name') || '불러온 캐릭터'
    await studio.characters.save(doc.id, doc); await refreshList(); $('charSelect').value = doc.id; step = 5; render(); toast('v2 시트를 불러왔어요. 검토 단계에서 확인해 주세요.')
  } catch (err) { toast('불러오기 실패: ' + err.message, true) }
})

async function refreshList(keep = true) {
  const list = await studio.characters.list()
  const cur = doc?.id
  $('charSelect').innerHTML = list.length ? list.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('') : '<option value="">캐릭터 없음</option>'
  if (keep && cur) $('charSelect').value = cur
  return list
}
async function open(id) {
  if (!id) return
  const d = await studio.characters.get(id)
  const fresh = newDoc()
  doc = { ...fresh, ...d, settings: { ...(d.settings || {}) }, base: { ...fresh.base, ...(d.base || {}) } }
  // 이미 제작을 시작한 캐릭터는 제작 단계부터 연다
  step = doc.base.portrait.chosen || doc.base.portrait.cands.length || doc.pending.length ? 6 : 0
  // 창을 닫아 둔 사이 끝난 작업을 반영한다
  for (const p of [...doc.pending]) { try { const j = await studio.job(p.jobId); if (j) applyJob(j) } catch { /* 모름 */ } }
  render(); setStatus('불러옴')
}
studio.project().then((p) => { PROJ = p }).catch(() => {}).then(() => refreshList()).then((list) => (list.length ? open(list[0].id) : (render(), setStatus('새 캐릭터를 만들어 시작해요')))).catch((e) => setStatus('불러오기 실패: ' + e.message))
})()
</script>

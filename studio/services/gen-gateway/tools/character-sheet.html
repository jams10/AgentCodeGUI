<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>캐릭터 시트</title>
<style>
:root{--bg:#101318;--surface:#191e25;--surface2:#202731;--input:#11161d;--line:#333e4b;--text:#f1f4f7;--muted:#a6b2c1;--dim:#8392a3;--accent:#91d8be;--accent-bg:#253e36;--blue:#9bc9f5;--warning:#f3cc8c;--danger:#f7a39b;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;font-size:14px;line-height:1.6}
button,input,textarea,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
input,select,textarea{display:block;width:100%;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
textarea{min-height:70px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #477a69;border-color:var(--accent)}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:var(--surface2);color:var(--text);font-size:13px;font-weight:650}
.btn:hover{background:#2c3540}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{color:#11241c;background:var(--accent);border-color:var(--accent);font-weight:800}.btn.primary:hover{background:#b0e7d2}
.btn.quiet{background:transparent;color:var(--muted)}.btn.small{padding:5px 10px;font-size:12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top select{width:auto;min-width:220px}.top .status{margin-left:auto;font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:calc(100vh - 62px);overflow:auto}
nav button{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:9px;padding:9px 10px;font-size:13px}
nav button b{width:22px;height:22px;border-radius:6px;background:#2a343f;color:var(--accent);display:grid;place-items:center;font-size:11px;flex-shrink:0}
nav button.on{background:#2a3f37;border-color:#466554;color:#d8f9eb}nav button.done b{background:var(--accent-bg)}
main{padding:22px 28px 60px;max-width:1180px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.field.full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.nav-foot{display:flex;justify-content:space-between;margin-top:22px}
.memo{margin-top:14px}.memo summary{cursor:pointer;color:var(--muted);font-size:12px}.memo .fields{margin-top:12px}
.review dl{display:grid;grid-template-columns:140px 1fr;gap:4px 14px;margin:8px 0 0;font-size:13px}.review dt{color:var(--muted)}.review dd{margin:0}.review .empty{color:var(--dim)}
pre.prompt{white-space:pre-wrap;background:#10151b;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;line-height:1.7;max-height:320px;overflow:auto;margin:10px 0 0;font-family:inherit}
details.p summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:8px}
.note{font-size:12px;color:var(--muted)}.warn{color:var(--warning)}.bad{color:var(--danger)}
.cands{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cand{position:relative;width:132px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c1015}
.cand img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#0c1015}
.cand.full img{aspect-ratio:2/3}
.cand.wide{width:300px}.cand.wide img,.cand.wide .ph{aspect-ratio:16/9;object-fit:contain}
.cand .ph{display:grid;place-items:center;aspect-ratio:4/5;color:var(--dim);font-size:11px}
.cand .bar{display:flex;flex-wrap:wrap;gap:4px;padding:5px}.cand .bar .btn{flex:1 1 44%;padding:4px 6px;font-size:11px}.btn.danger{color:var(--danger)}
.vid .x{border:0;background:transparent;color:var(--danger);font-size:13px;padding:0 0 0 6px;cursor:pointer}
.cand.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.cand .tag{position:absolute;top:5px;left:5px;background:var(--accent);color:#11241c;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800}
.jobs{font-size:12px;color:var(--muted);margin-top:8px}.jobs span{display:inline-block;margin-right:10px}
.state{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.state:first-of-type{border-top:0}.state .name b{display:block}.state .name small{color:var(--dim);font-size:11px}
.pill{display:inline-block;font-size:10px;border-radius:6px;padding:2px 7px;background:#28343f;color:var(--blue);margin-left:6px}
.pill.once{background:#3b2f22;color:var(--warning)}
.vids{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.vid{border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted)}.vid.ok{color:var(--accent);cursor:pointer}
.locked{opacity:.5;pointer-events:none}
select.count{width:auto;padding:7px 8px}
.cand .num{position:absolute;top:5px;right:5px;background:#000a;color:var(--text);border-radius:6px;padding:0 6px;font-size:10px}
.cand .edit-note{font-size:10px;color:var(--muted);padding:4px 6px 0;line-height:1.35;max-height:40px;overflow:hidden}
.cand.editing{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.cands .cand{width:150px}.cands .cand.wide{width:300px}
.editbox{margin-top:12px;border:1px solid #3b5a78;border-radius:10px;padding:12px;background:#15202b}.editbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.refill{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.navgap{flex:1;min-height:18px;border-bottom:1px solid var(--line);margin:8px 4px}code{font-size:12px;background:#10151b;border-radius:5px;padding:1px 5px}
.toast{position:fixed;right:18px;bottom:18px;background:#1f2b27;border:1px solid #466554;border-radius:10px;padding:10px 14px;font-size:13px;max-width:420px}
.toast.bad{background:#2d1f1f;border-color:#6b3a36}
.group{margin:8px 0 26px}.gh{font-size:18px;margin:0 0 4px}.group > .note{margin:0 0 12px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.ctabs button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:650}
.ctabs button.on{background:var(--accent-bg);border-color:#466554;color:#d8f9eb}.ctabs .add{background:transparent;border-style:dashed}
.card.photo{background:var(--surface2)}.card.photo .row{align-items:center}.refthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="top">
  <select id="charSelect" aria-label="캐릭터 고르기"></select>
  <button type="button" class="btn" id="newChar">새 캐릭터</button>
  <button type="button" class="btn quiet" id="importV2">v2 시트 JSON 불러오기</button>
  <button type="button" class="btn quiet" id="deleteChar">캐릭터 삭제</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp" hidden>
  <span class="status" id="status" aria-live="polite">불러오는 중…</span>
</div>
<div class="layout">
  <nav id="steps" aria-label="단계"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
'use strict';
(() => {
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

// ── 입력 항목 ────────────────────────────────────────────────
const F = {
  identity: [['name','캐릭터 이름','예: 서린'],['job','직업','예: 동네 수리점 직원'],['gender','성별','예: 여성'],['age','나이대','예: 20대 후반']],
  face: [['faceShape','얼굴형','예: 짧은 타원형, 볼에 살이 약간 있음'],['eyes','눈','예: 길고 약간 처진 눈'],['eyebrows','눈썹','예: 짙고 곧은 눈썹'],['nose','코','예: 낮은 콧대, 둥근 코끝'],['mouth','입 · 입술','예: 보통 크기 입, 아랫입술이 조금 두꺼움'],['jaw','턱 · 광대','예: 둥근 턱, 약간 넓은 광대'],['skinTone','피부 톤','예: 중간 밝기의 웜 베이지'],['hair','헤어스타일','예: 검은 턱 길이 단발, 귀 뒤로 넘김'],['firstImpression','첫인상','예: 둥근 얼굴과 짙은 눈썹으로 단단하고 친근한 인상','textarea',true],['personality','성격 · 감정 표현 방식 · 선택','예: 무뚝뚝한 편이라 기뻐도 크게 웃지 않고 눈으로 웃는다. 쑥스러우면 시선을 피한다.','textarea',true]],
  body: [['proportion','등신 · 신체 비율','예: 7.5등신, 다리가 긴 편, 머리는 작은 편','text',true],['bodyDescription','체형 요약','예: 평균 체격에 하체가 조금 더 발달한 체형','textarea',true],['frame','골격','예: 중간 골격'],['neck','목','예: 보통 길이와 굵기'],['shoulderDescription','어깨','예: 보통 너비, 완만한 어깨선'],['chestDescription','가슴 · 흉곽','예: 보통 볼륨, 흉곽이 납작하지 않음'],['waistDescription','허리','예: 완만하게 들어간 허리'],['hipDescription','골반 · 엉덩이','예: 골반이 어깨보다 약간 넓음'],['armDescription','팔','예: 전완이 단단하고 팔은 보통 굵기'],['legDescription','다리','예: 허벅지가 탄탄하고 종아리는 보통'],['muscleDescription','근육','예: 하체와 전완에 근육이 조금 보임'],['fatDescription','체지방','예: 복부와 볼에 부드러운 볼륨']],
  // 설정 메모 — 이미지 모델은 숫자를 재현하지 못하고, 치수 표현은 안전 검사에 걸릴 수 있어 프롬프트에 넣지 않는다
  memo: [['heightCm','키 (cm)','예: 168'],['weightKg','몸무게 (kg)','예: 61'],['shoulderCm','어깨너비 (cm)',''],['chestCm','가슴둘레 (cm)',''],['underbustCm','밑가슴둘레 (cm)',''],['cupSize','컵 · 사이즈 표기',''],['waistCm','허리둘레 (cm)',''],['hipCm','엉덩이둘레 (cm)',''],['armCm','위팔둘레 (cm)',''],['thighCm','허벅지둘레 (cm)',''],['muscleKg','골격근량 (kg)',''],['bodyFatPct','체지방률 (%)','']],
  costume: [['costume','코스튬 · 색 / 소재 / 핏','예: 짙은 남색 면 작업 재킷, 흰 라운드 티셔츠, 스트레이트 핏 회색 면바지','textarea',true],['accessories','액세서리 · 소지품','예: 검은 스포츠 시계, 작은 은색 귀걸이','textarea',true],['shoes','신발','예: 흰색 가죽 운동화, 낮은 굽'],['heldItem','손에 드는 물건 · 선택','예: 접은 작업용 장갑']]

const RATIO = { portrait: { '4:5': [1024, 1280], '3:4': [1024, 1360], '1:1': [1024, 1024] }, full: { '2:3': [1024, 1536], '3:4': [1152, 1536], '9:16': [1152, 2048] } }

const SHEET = [2048, 1152]
// 기준 자세 — 모든 캐릭터 공통 고정. 턴어라운드의 바탕이고, 실제 포즈는 상태별 전신에서 바뀐다
const BASE_POSE = '앞을 똑바로 보고 선 자세. 몸과 얼굴이 정면, 체중은 양발에 고르게, 발은 어깨너비보다 조금 좁게 벌린다. 팔은 몸 옆에 자연스럽게 내리되 몸통에서 살짝 떨어뜨려 옷과 몸의 실루엣이 보인다.'

  '완전히 가상의 인물 한 명. 설정한 외모를 임의로 미화하거나 과장하지 않는다.',
  '첫인상을 표현하려고 미소 · 분노 · 피로 같은 상태를 추가하지 않는다.',
  '중립적인 정면 조명, 실제 피부 질감, 고른 노출. 과도한 보정 · 광각 왜곡 · 극적인 역광 없음.',
  '스캔라인 · 노이즈 · VHS 번짐 같은 화면 효과는 넣지 않는다(나중에 일괄 후처리).',
  '글자 · 이름표 · 치수선 · UI · 체력바 · 테두리 · 콜라주 · 추가 인물 없음.'
].join('\n')
const DEFAULT_SETTINGS = { rules: DEFAULT_RULES, analysisEngine: 'codex', analysisModel: '', portraitRatio: '4:5', fullRatio: '2:3', background: '중간 톤 중성 회색(#808080 정도) 단색 배경. 무늬 · 그라데이션 · 비네팅 없음', constraints: '', model: 'gpt-image-2.5-sunburst', quality: 'medium', videoSeconds: 4, videoResolution: '480p', baseOutfit: DEFAULT_OUTFIT }

// ── 공통 상태 규격 — 모든 캐릭터 · 코스튬에 같은 문구 ──────────────
// bust: 상반신(메인 UI) 8개, full: 전신(상세창) 6개. idle은 코스튬 기준 이미지 자체를 쓴다.
const STATES = [
  { id: 'idle', name: '기본', note: '평상시', loop: true, full: true,
    face: '무표정. 눈과 입 주변의 힘을 풀고 입을 편하게 다문다. 정면 시선.', bust: '어깨 수평, 편안한 중립 자세.', fullPose: '기본 서기 자세.',

    motion: 'Sustained pain: tense shallow breathing, slight trembling of the shoulders, wincing eyes. No skin color change, no glow or visual effects.' },
  { id: 'exhausted', name: '탈진', note: '체력 낮음', loop: true, full: true,
    face: '반쯤 감긴 무거운 눈꺼풀, 힘없이 조금 벌어진 입, 이마에 땀.', bust: '어깨가 처지고 고개가 약간 숙여진다.', fullPose: '무릎을 약간 굽히고 상체를 앞으로 숙여 한 손으로 무릎을 짚는다. 다른 팔은 늘어뜨린다.',

function migrate(d) {
  const fresh = newDoc()
  if ((d.version ?? 3) >= 4) return { ...fresh, ...d, settings: { ...(d.settings || {}) }, base: { ...fresh.base, ...(d.base || {}) }, costumes: (d.costumes?.length ? d.costumes : fresh.costumes).map((c) => ({ ...newCostume(c.name), ...c, states: { bust: {}, full: {}, ...(c.states || {}) } })) }
  const c = fresh.costumes[0]
  for (const k of F.costume.map((f) => f[0])) if (d.values?.[k] != null) c.values[k] = d.values[k]
  if (d.base?.portrait) c.portrait = d.base.portrait
  if (d.base?.full) c.full = d.base.full
  c.states = { bust: {}, full: {}, ...(d.states || {}) }
  const values = { ...(d.values || {}) }
  for (const k of F.costume.map((f) => f[0])) delete values[k]
  const keyOf = (k) => (k.startsWith('base.portrait') ? 'c.base.portrait' + k.slice(13) : k.startsWith('base.full') && !k.startsWith('base.fullSheet') ? 'c.base.full' + k.slice(9) : /^(bust|full)\./.test(k) ? 'c.base.' + k : null)
  const pending = (d.pending || []).map((p) => ({ ...p, key: keyOf(p.key) })).filter((p) => p.key)
  return { ...fresh, id: d.id, name: d.name, values, settings: { ...(d.settings || {}) }, costumes: [c], pending }
}

// 작업 상태 반영 — 성공하면 결과를 그 칸의 후보(영상은 영상 목록)에 넣는다
function applyJob(j) {
  const p = doc?.pending.find((x) => x.jobId === j.id)
  if (!p) return false
  const done = ['succeeded', 'failed', 'rejected', 'canceled'].includes(j.state)
  if (!done) { p.state = j.state; return true }
  doc.pending = doc.pending.filter((x) => x.jobId !== j.id)
  if (j.state === 'succeeded') {
    const isVideo = p.key.endsWith('.video')
    const s = slotOf(isVideo ? p.key.slice(0, -6) : p.key)
    if (s) for (const o of j.outputs ?? []) {
      if (isVideo && o.kind === 'video') (s.videos ??= []).push({ jobId: j.id, outputId: o.id })
      if (!isVideo && o.kind === 'image') s.cands.push({ jobId: j.id, outputId: o.id, ...(p.from ? { from: p.from, note: p.note, depth: p.depth } : {}) })
    }
  } else if (j.state === 'failed') toast('생성 실패: ' + (j.error || '이유를 알 수 없어요'), true)
  save()
  return true
}

/** 파일을 골라 긴 변 1600px JPEG로 줄인다 — { dataUrl, thumb, name } 또는 null */
function pickPhoto() {
  return new Promise((resolve) => {
    const input = $('photoFile')
    input.value = ''
    input.onchange = async () => {
      const f = input.files[0]
      if (!f) return resolve(null)
      try {
        const url = URL.createObjectURL(f)
        const im = new Image(); im.src = url; await im.decode()
        const shrink = (max, q) => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); return cv.toDataURL('image/jpeg', q) }
        const out = { dataUrl: shrink(1600, 0.9), thumb: shrink(240, 0.8), name: f.name }
        URL.revokeObjectURL(url)
        resolve(out)
      } catch { toast('이미지를 읽지 못했어요(PNG · JPEG · WebP)', true); resolve(null) }
    }
    input.click()
  })
}
let analyzing = null
/** 사진(파일 또는 라이브러리)을 분석해 칸을 채운다. target: 'doc'(얼굴 · 체형) 또는 코스튬 */
async function fillFromPhoto(kind, source, target) {
  let image = null

  else if (source === 'library') { const r = await studio.pickImage(); if (!r) return; image = { outputId: r.outputId } }
  else { const ph = await pickPhoto(); if (!ph) return; setStatus('사진 올리는 중…'); image = { path: (await studio.upload(ph.dataUrl, ph.name)).path } }
  analyzing = kind; render(); setStatus('AI가 사진을 분석하는 중… (10~30초)')
  try {
    const r = await studio.analyze(kind, [image], { engine: S().analysisEngine, model: S().analysisModel })
    const vals = target === 'doc' ? doc.values : target.values
    const filled = Object.entries(r.values).filter(([, val]) => val)
    const clash = filled.filter(([k, val]) => String(vals[k] ?? '').trim() && String(vals[k]).trim() !== val)
    const overwrite = !clash.length || confirm(`이미 적은 칸 ${clash.length}개가 있어요. 분석 결과로 덮어쓸까요?\n(취소하면 빈 칸만 채워요)`)
    let n = 0
    for (const [k, val] of filled) if (overwrite || !String(vals[k] ?? '').trim()) { vals[k] = val; n++ }
    save(); toast(`사진에서 ${n}칸을 채웠어요. 확인하고 고쳐 주세요.`); setStatus('분석 끝')
  } catch (e) { toast('분석 실패: ' + e.message, true); setStatus('분석 실패') }
  analyzing = null; render()
}
async function costumeFromPhoto(c) {

  setStatus('사진 올리는 중…')
  try {
    const { path } = await studio.upload(ph.dataUrl, ph.name)

    analyzing = 'costume'; render(); setStatus('AI가 옷차림을 분석하는 중… (10~30초)')

    save(); toast('옷차림을 칸에 채웠어요. 제작 단계의 ⑤ 코스튬 시트에서 이 사진으로 옷만 정리한 시트를 요청할 수 있어요.'); setStatus('분석 끝')

    ${anchorCard('base.portrait', '① 원형 초상화', true, '머리 · 목 · 어깨가 보이는 얼굴 기준 한 장 — 모든 이미지가 이 얼굴을 따라요. 여러 장 뽑고 "고치기"로 다듬어 최종 얼굴을 정해요', portraitPrompt(), 'portrait', P ? `<div class="row refill"><span class="note">고쳐서 확정한 얼굴과 얼굴 칸의 글이 다를 수 있어요 — 다음 단계 프롬프트가 이 글을 써요.</span><span class="spacer"></span>${analyzing === 'face' ? '<span class="note">분석 중…</span>' : '<button type="button" class="btn small" data-refill-face="1">확정 얼굴로 얼굴 칸 다시 채우기</button>'}</div>` : '')}
    ${anchorCard('base.faceSheet', '② 얼굴 턴어라운드 · 정면 · 반측면 · 측면 · 후면', !!P, P ? '원형 초상화를 참조해요' : '① 확정 후 열려요', faceSheetPrompt(), 'sheet')}
    ${anchorCard('base.full', '③ 원형 전신', !!FS, FS ? '초상화 · 얼굴 시트를 참조해요' : '② 확정 후 열려요', fullPrompt(), 'full')}
    ${anchorCard('base.fullSheet', '④ 전신 턴어라운드 · 정면 · 반측면 · 측면 · 후면', !!BF, BF ? '원형 전신 · 얼굴 시트를 참조해요' : '③ 확정 후 열려요', fullSheetPrompt(), 'sheet')}</div>
    <div class="group"><h2 class="gh">B · 코스튬 <span class="note">— 원형에 옷을 입히고, 그 옷으로 상태 이미지 · 영상을 만들어요.</span></h2>
    ${costumeTabs('data-board-costume')}
    ${hasCostume ? '' : '<p class="warn">이 코스튬의 옷이 비어 있어요 — 4단계 코스튬에서 적거나 패션 사진으로 채워 주세요.</p>'}
    ${anchorCard(`${pre}.sheet`, `⑤ 코스튬 시트 · 옷만 정리 <span class="note">(선택 · 권장)</span>`, !!hasCostume, c.ref ? '패션 사진을 참조해요' : '코스튬 글로 만들어요', costumeSheetPrompt(c), 'sheet')}
    ${anchorCard(`${pre}.portrait`, `⑥ 코스튬 초상화`, !!(P && FS && hasCostume), P && FS ? `원형 초상화 · 얼굴 시트${sheetRef(c) ? ' · 코스튬 시트' : ''}를 참조해요` : '② 확정 후 열려요', costumePortraitPrompt(c), 'portrait')}
    ${anchorCard(`${pre}.full`, `⑦ 코스튬 전신`, !!(BF && BS && hasCostume), BF && BS ? `원형 전신 · 전신 시트${sheetRef(c) ? ' · 코스튬 시트' : ''}${CP ? ' · 코스튬 초상화' : ''}를 참조해요` : '④ 확정 후 열려요', costumeFullPrompt(c), 'full')}
    <div class="card ${CP ? '' : 'locked'}"><div class="row"><h2>⑧ 상반신 상태 · 메인 UI</h2><span class="note">${CP ? '' : '⑥ 확정 후 열려요'}</span><span class="spacer"></span><button type="button" class="btn" data-batch="bust" ${CP && todo('bust').length ? '' : 'disabled'}>남은 상태 ${todo('bust').length}개 한 번에 요청</button></div>
      ${STATES.map((st) => stRow('bust', st)).join('')}</div>
    <div class="card ${CF ? '' : 'locked'}"><div class="row"><h2>⑨ 전신 상태 · 상세창</h2><span class="note">${CF ? '' : '⑦ 확정 후 열려요'}</span><span class="spacer"></span><button type="button" class="btn" data-batch="full" ${CF && todo('full').length ? '' : 'disabled'}>남은 상태 ${todo('full').length}개 한 번에 요청</button></div>
      ${STATES.filter((s) => s.full).map((st) => stRow('full', st)).join('')}</div></div>`
}
let renderQueued = false
function render() {
  if (renderQueued) return
  renderQueued = true
  requestAnimationFrame(() => { renderQueued = false; renderNow() })
}
function renderNow() {
  if (!doc) { $('main').innerHTML = '<p class="note">캐릭터를 고르거나 새로 만들어 주세요.</p>'; $('steps').innerHTML = ''; return }
  const filled = [F.identity, F.face, F.body].map((l) => l.some(([id]) => v(id))).concat(doc.costumes.some((c) => F.costume.some(([id]) => cv(c, id))))
  $('steps').innerHTML = STEPS.map((name, i) => `${i === LAST ? '<span class="navgap"></span>' : ''}<button type="button" data-step="${i}" class="${i === step ? 'on' : ''}${filled[i] ? ' done' : ''}"><b>${i === LAST ? '⚙' : i + 1}</b>${esc(name)}</button>`).join('')
  const sy = scrollY
  $('main').innerHTML = stepHtml() + (step < 6 ? `<div class="nav-foot"><button type="button" class="btn quiet" data-step="${step - 1}" ${step === 0 ? 'disabled' : ''}>← 이전</button><button type="button" class="btn primary" data-step="${step + 1}">다음 →</button></div>` : '')
  scrollTo(0, sy)
}
async function loadThumb(id) {
  thumbs.set(id, null)
  try {
    const d = await studio.thumb(id, 360)
    thumbs.set(id, d || '')
    if (!d) toast('미리보기를 만들지 못했어요(이미지가 아니거나 읽을 수 없음)', true)
  } catch (e) { thumbs.set(id, ''); toast('미리보기 실패: ' + e.message, true) }
  render()
}

// ── 이벤트 ──────────────────────────────────────────────────
document.addEventListener('input', (e) => {
  const t = e.target
  if (t.dataset.f) { doc.values[t.dataset.f] = t.value; save(); if (t.dataset.f === 'name') doc.name = t.value }
  if (t.dataset.cf) { cur().values[t.dataset.cf] = t.value; save() }
  if (t.dataset.cname) { cur().name = t.value; save() }
  if (t.dataset.editNote && editing) editNotes[editing.key + '|' + editing.outputId] = t.value
  if (t.dataset.s && t.tagName !== 'SELECT') { doc.settings[t.dataset.s] = t.value; save() }
  if (t.dataset.o && t.tagName !== 'SELECT') { (doc.settings.overrides ??= {})[t.dataset.o] = t.value; save() }
  if (t.dataset.t && t.tagName !== 'SELECT') { TOOLSET[t.dataset.t] = t.value; saveTool() }
})
document.addEventListener('change', (e) => {
  const t = e.target
  if (t.dataset.cname) render()
  if (t.dataset.count) { counts[t.dataset.count] = Number(t.value) || 1; render() }
  if (t.dataset.editCount && editing) editing.n = Number(t.value) || 1
  if (t.dataset.s && t.tagName === 'SELECT') { doc.settings[t.dataset.s] = t.value; save(); render() }
  if (t.dataset.o && t.tagName === 'SELECT') { (doc.settings.overrides ??= {})[t.dataset.o] = t.value; save(); render() }
  if (t.dataset.t && t.tagName === 'SELECT') { TOOLSET[t.dataset.t] = t.dataset.t === 'videoSeconds' ? Number(t.value) : t.value; saveTool(); render() }
})
document.addEventListener('click', (e) => {
  const b = e.target.closest('button,[data-reveal]')
  if (!b || b.disabled) return
  const d = b.dataset
  const c = cur()
  if (d.step != null) { step = Math.max(0, Math.min(LAST, Number(d.step))); scrollTo(0, 0); render() }
  else if (d.resetTool) { if (!confirm('공통 제작 규칙과 기본 복장을 시작값으로 되돌릴까요?')) return; TOOLSET.rules = DEFAULT_SETTINGS.rules; TOOLSET.baseOutfit = DEFAULT_SETTINGS.baseOutfit; saveTool(); render() }
  else if (d.go != null) { step = Number(d.go); scrollTo(0, 0); render() }
  else if (d.costume || d.boardCostume) { doc.current = d.costume || d.boardCostume; save(); render() }
  else if (d.addCostume) { const n = newCostume(`코스튬 ${doc.costumes.length + 1}`); doc.costumes.push(n); doc.current = n.id; save(); if (step !== 3) { step = 3; scrollTo(0, 0) } render() }
  else if (d.delCostume) {
    if (doc.costumes.length < 2 || !confirm(`'${c.name}' 코스튬을 시트에서 뺄까요? 만든 이미지는 아트 라이브러리에 남아요.`)) return
    doc.costumes = doc.costumes.filter((x) => x.id !== c.id); doc.current = doc.costumes[0].id; doc.pending = doc.pending.filter((p) => !p.key.startsWith(`c.${c.id}.`)); save(); render()
  }
  else if (d.fill) { const [kind, src] = d.fill.split('|'); fillFromPhoto(kind, src, 'doc') }
  else if (d.del) removeJob(d.del)
  else if (d.refillFace) fillFromPhoto('face', { outputId: doc.base.portrait.chosen }, 'doc')
  else if (d.edit) { const i = d.edit.lastIndexOf('|'); editing = { key: d.edit.slice(0, i), outputId: d.edit.slice(i + 1), n: 1 }; render(); setTimeout(() => $('editNote')?.focus(), 60) }
  else if (d.editCancel) { editing = null; render() }
  else if (d.editGo && editing) genEdit(editing.key, editing.outputId, editNotes[editing.key + '|' + editing.outputId] || '', editing.n || 1)
  else if (d.costumePhoto) costumeFromPhoto(c)
  else if (d.costumeUnref) { c.ref = null; c.refThumb = null; save(); render() }
  else if (d.genAnchor) genAnchor(d.genAnchor)
  else if (d.genState) { const [k, id] = d.genState.split('|'); genState(c, k, STATES.find((s) => s.id === id)) }
  else if (d.genVideo) { const [k, id] = d.genVideo.split('|'); genVideo(c, k, STATES.find((s) => s.id === id)) }
  else if (d.batch) { const kind = d.batch; STATES.filter((st) => (kind === 'bust' || st.full) && st.id !== 'idle' && !slotOf(`c.${c.id}.${kind}.${st.id}`).chosen && !doc.pending.some((p) => p.key === `c.${c.id}.${kind}.${st.id}`)).forEach((st) => genState(c, kind, st)) }
  else if (d.choose) {
    const i = d.choose.lastIndexOf('|'); const key = d.choose.slice(0, i); const oid = d.choose.slice(i + 1); const s = slotOf(key)
    const isAnchor = key.startsWith('base.') || key.split('.').length === 3
    if (s.chosen && s.chosen !== oid && isAnchor && !confirm('기준 이미지를 바꾸면 이미 만든 다음 단계 이미지와 맞지 않을 수 있어요. 바꿀까요?')) return
    s.chosen = oid; save(); render()
  } else if (d.reveal) studio.reveal(d.reveal).catch(() => toast('이 PC에 보관된 파일이 없어요.', true))
})
$('charSelect').addEventListener('change', (e) => open(e.target.value))
$('newChar').addEventListener('click', async () => {
  doc = newDoc(); doc.id = 'c' + Date.now().toString(36); doc.name = '새 캐릭터'
  step = 0; await studio.characters.save(doc.id, doc); await refreshList(); $('charSelect').value = doc.id; render(); setStatus('새 캐릭터를 만들었어요')
})
$('deleteChar').addEventListener('click', async () => {
  if (!doc || !confirm(`'${doc.name}' 캐릭터 파일을 지울까요? 만든 이미지는 아트 라이브러리에 남아요.`)) return
  await studio.characters.remove(doc.id); doc = null; await refreshList(); const first = $('charSelect').value; first ? open(first) : render()
})
// 이전 v2 시트(JSON) 불러오기 — 같은 항목 이름을 그대로 옮긴다
$('importV2').addEventListener('click', () => $('importFile').click())
$('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''
  if (!f) return
  try {
    const j = JSON.parse(await f.text())
    const vals = j?.values
    if (!vals || typeof vals !== 'object') throw new Error('v2 캐릭터 시트 JSON이 아니에요')
    doc = newDoc(); doc.id = 'c' + Date.now().toString(36)
    const known = new Set([...F.identity, ...F.face, ...F.body, ...F.memo].map((x) => x[0]))
    const cknown = new Set(F.costume.map((x) => x[0]))
    for (const [k, val] of Object.entries(vals)) {
      if (typeof val !== 'string' && typeof val !== 'number') continue
      if (known.has(k)) doc.values[k] = String(val)
      else if (cknown.has(k)) doc.costumes[0].values[k] = String(val)
    }
    // 비율 · 배경은 캐릭터 시트 설정을 따른다 — 캐릭터별 추가 제약만 옮긴다
    if (typeof vals.constraints === 'string') doc.settings.constraints = vals.constraints
    doc.name = v('name') || '불러온 캐릭터'
    await studio.characters.save(doc.id, doc); await refreshList(); $('charSelect').value = doc.id; step = 5; render(); toast('v2 시트를 불러왔어요. 검토 단계에서 확인해 주세요.')
  } catch (err) { toast('불러오기 실패: ' + err.message, true) }
})

async function refreshList(keep = true) {
  const list = await studio.characters.list()
  const curId = doc?.id
  $('charSelect').innerHTML = list.length ? list.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('') : '<option value="">캐릭터 없음</option>'
  if (keep && curId) $('charSelect').value = curId
  return list
}
async function open(id) {
  if (!id) return
  const d = await studio.characters.get(id)
  const old = (d.version ?? 3) < 4
  doc = migrate(d)
  // 이미 제작을 시작한 캐릭터는 제작 단계부터 연다
  step = allSlots().some((s) => s.cands.length) || doc.pending.length ? 6 : 0
  // 창을 닫아 둔 사이 끝난 작업을 반영한다
  for (const p of [...doc.pending]) { try { const j = await studio.job(p.jobId); if (j) applyJob(j) } catch { /* 모름 */ } }
  await prune()
  if (old) { save(); toast('새 구조(캐릭터 원형 + 코스튬)로 옮겼어요. 예전 기준 이미지 · 상태는 "기본 코스튬"에 있고, 원형은 새로 만들어요.') }
  render(); setStatus('불러옴')
}
// 후보 · 영상 지우기 — 이 PC 파일과 서비스 쪽 결과까지. 그 작업의 결과를 모든 칸에서 빼고, 확정이었으면 푼다
async function removeJob(jobId) {
  const used = allSlots().filter((s) => [...(s.cands || []), ...(s.videos || [])].some((c) => c.jobId === jobId))
  const wasChosen = used.some((s) => (s.cands || []).some((c) => c.jobId === jobId && c.outputId === s.chosen))
  if (!confirm(`이 결과를 지울까요?${wasChosen ? '\n확정한 이미지예요 — 지우면 확정이 풀려요.' : ''}\n이 PC의 파일과 ComfyCloud 서버 사본까지 지워요. 되돌릴 수 없어요.`)) return
  try {
    await studio.deleteJob(jobId)
  } catch (e) { return toast('지우지 못했어요: ' + e.message, true) }
  for (const s of used) {
    if ((s.cands || []).some((c) => c.jobId === jobId && c.outputId === s.chosen)) s.chosen = null
    s.cands = (s.cands || []).filter((c) => c.jobId !== jobId)
    if (s.videos) s.videos = s.videos.filter((c) => c.jobId !== jobId)
  }
  if (editing && !allSlots().some((s) => (s.cands || []).some((c) => c.outputId === editing.outputId))) editing = null
  save(); render(); toast('지웠어요.')
}
// 아트 화면에서 지운 결과는 후보 · 영상에서 빼고, 확정이었으면 확정을 푼다.
// 지운 작업도 기록은 남고 결과만 비므로 "작업은 있는데 그 결과가 없음"일 때만 뺀다(연결 실패는 그대로 둔다).
async function prune() {
  const slots = allSlots()
  const ids = new Set(slots.flatMap((s) => [...(s.cands || []), ...(s.videos || [])].map((c) => c.jobId)))
  const alive = new Map()
  await Promise.all([...ids].map(async (id) => {
    try { const j = await studio.job(id); if (j) alive.set(id, new Set((j.outputs || []).map((o) => o.id))) } catch { /* 모름 */ }
  }))
  const gone = (c) => alive.get(c.jobId)?.has(c.outputId) === false
  let n = 0
  for (const s of slots) {
    const cands = (s.cands || []).filter((c) => !gone(c))
    const videos = (s.videos || []).filter((c) => !gone(c))
    n += (s.cands || []).length - cands.length + (s.videos || []).length - videos.length
    if (s.chosen && (s.cands || []).some((c) => c.outputId === s.chosen && gone(c))) s.chosen = null
    s.cands = cands
    if (s.videos) s.videos = videos
  }
  if (n) { save(); toast(`지운 결과 ${n}개를 시트에서 뺐어요.`) }
}
Promise.all([studio.project().then((p) => { PROJ = p }).catch(() => {}), studio.settings.get().then((t) => { TOOLSET = t && typeof t === 'object' ? Object.fromEntries(Object.entries(t).filter(([k]) => TOOL_KEYS.includes(k))) : {} }).catch(() => {})]).then(() => refreshList()).then((list) => (list.length ? open(list[0].id) : (render(), setStatus('새 캐릭터를 만들어 시작해요')))).catch((e) => setStatus('불러오기 실패: ' + e.message))
})()
</script>
